# Milk-only ByteTrack configuration. YOLO supplies boxes above --track-conf (0.10).
# Weak boxes can support existing tracks, but cannot start one below 0.40.
# The verifier separately applies --conf (0.40) to all crossing observations.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.40
track_buffer: 30
match_thresh: 0.8
fuse_score: True
